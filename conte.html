<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Récit · Soalma</title>
  <meta name="description" content="Lire et écouter un conte, une légende ou un récit historique du Burkina Faso, en tableaux illustrés et animés.">
  <meta name="theme-color" content="#0D0B16">
  <meta property="og:image" content="https://porgoabdoulnassirou.github.io/Projet_Tech_Web_et_Multimediat/assets/img/og-image.png">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="module" src="assets/js/reader.js"></script>
</head>
<body>
  <!-- en-tete -->
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="./" aria-label="Soalma, accueil"><img src="assets/img/logo.svg" alt="" width="34" height="34">Soalma</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav id="nav" class="nav" aria-label="Navigation principale">
        <a href="carte.html">La carte</a>
        <a href="contes.html">Les récits</a>
        <a href="a-propos.html">Le projet</a>
        <a class="btn btn-primary btn-sm" href="contes.html" data-random>Conte du soir</a>
      </nav>
    </div>
  </header>
  <!-- /en-tete -->

  <main id="contenu" class="reader" data-theme="nuit">
    <div class="stage">
      <div class="stage-scene" id="stage"></div>
      <div class="stage-caption">
        <span class="step" id="step"></span>
        <div class="dots" id="dots" role="group" aria-label="Aller à un tableau"></div>
      </div>
    </div>

    <article class="panel" id="panel">
      <header class="panel-head">
        <div class="crumbs">
          <a class="btn btn-ghost btn-sm" href="contes.html" data-icon="arrowLeft">Les récits</a>
          <span class="badge" id="type"></span>
        </div>
        <h1 id="title">Chargement du récit…</h1>
        <div class="meta" id="meta"></div>
        <div class="tools" role="toolbar" aria-label="Réglages de lecture">
          <button class="icon-btn" type="button" id="theme" aria-pressed="false" title="Mode jour" aria-label="Mode lecture de jour" data-icon="sun"></button>
          <button class="icon-btn" type="button" id="size" title="Taille du texte" aria-label="Agrandir le texte" data-icon="text"></button>
          <button class="icon-btn" type="button" id="glossary-open" title="Mots du récit" aria-label="Ouvrir le glossaire" data-icon="book"></button>
          <a class="icon-btn" id="onmap" title="Voir sur la carte" aria-label="Voir ce récit sur la carte" data-icon="map"></a>
          <button class="icon-btn" type="button" id="share" title="Partager" aria-label="Partager ce récit" data-icon="share"></button>
        </div>
      </header>

      <section id="body" tabindex="-1" aria-live="polite"></section>
    </article>
  </main>

  <section class="player" aria-label="Lecteur audio">
    <div class="player-left">
      <button class="play" type="button" id="play" aria-label="Écouter le récit"></button>
    </div>
    <div class="player-info">
      <p class="now" id="now" style="margin:0"></p>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    </div>
    <div class="player-right">
      <label class="visually-hidden" for="voice">Langue de la narration</label>
      <select id="voice"></select>
      <button class="icon-btn rate" type="button" id="rate" aria-label="Vitesse de lecture">1×</button>
      <button class="icon-btn" type="button" id="ambience" aria-pressed="false" aria-label="Ambiance sonore de la nuit" title="Ambiance sonore" data-icon="music"></button>
    </div>
  </section>

  <dialog id="glossary" aria-labelledby="glossary-title">
    <div class="dialog-head">
      <h2 id="glossary-title">Les mots du récit</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fermer" data-icon="x"></button>
    </div>
    <div class="dialog-body"><dl class="glossary" id="glossary-list"></dl></div>
  </dialog>

  <div class="motif" aria-hidden="true"></div>
  <div style="height:76px;background:var(--nuit-950)"></div>
</body>
</html>
