<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche des scènes (outil de développement)</title>
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  body { padding: 16px; }
  .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  figure { margin: 0; }
  figure div { aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; }
  figcaption { font-size: 12px; color: #aaa; padding: 4px 0; }
</style>
</head>
<body>
<div class="g" id="g"></div>
<script type="module">
  import { CONTES } from '../assets/js/data.js';
  import { renderScene } from '../assets/js/scenes.js';
  if (new URLSearchParams(location.search).has('big')) document.getElementById('g').style.gridTemplateColumns = '1fr 1fr';
  const only = new URLSearchParams(location.search).get('id');
  const g = document.getElementById('g');
  for (const c of CONTES) {
    if (only && c.id !== only) continue;
    c.tableaux.forEach((t, i) => {
      g.insertAdjacentHTML('beforeend', `<figure><div>${renderScene(t.scene, c.id + i, { title: t.titre })}</div><figcaption>${c.id} ${i + 1} · ${t.titre}</figcaption></figure>`);
    });
  }
</script>
</body>
</html>
