<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage (outil de développement)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,7,15,.92) 0%, rgba(8,7,15,.55) 50%, rgba(8,7,15,0) 80%); }
  .txt { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; max-width: 620px; }
  .txt h1 { font-size: 68px; margin: 0 0 18px; }
  .txt h1 em { color: var(--mil); font-weight: 500; }
  .txt p { font-size: 24px; color: var(--text-2); margin: 0; }
  .brand { font-size: 34px; margin-bottom: 28px; }
  .brand img { width: 48px; height: 48px; }
  body.icon { width: 512px; height: 512px; background: #0D0B16; display: grid; place-items: center; }
  body.icon img { width: 360px; height: 360px; }
</style>
</head>
<body>
<script type="module">
  import { renderScene } from '../assets/js/scenes.js';
  if (location.hash === '#icon') {
    document.body.className = 'icon';
    document.body.innerHTML = '<img src="../assets/img/logo.svg" alt="">';
  } else {
    document.body.innerHTML = `<div id="bg">${renderScene({ sky: 'dusk', items: [
      { k: 'baobab', x: 1250, layer: 'mid', s: 1.4 }, { k: 'rider', x: 1020, spear: true, cape: true },
      { k: 'hut', x: 700, layer: 'far' }, { k: 'hut', x: 800, layer: 'far' }, { k: 'grass', x: 1400, w: 200 },
    ] }, 'og')}</div><div class="shade"></div>
    <div class="txt"><div class="brand" style="display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:600"><img src="../assets/img/logo.svg" alt="">Soalma</div>
    <h1>Contes et légendes <em>du Burkina Faso</em></h1><p>Carte interactive, récits illustrés et voix en langues nationales.</p></div>`;
  }
  document.querySelectorAll('.scene *').forEach((el) => { el.style.animationPlayState = 'paused'; });
</script>
</body>
</html>
